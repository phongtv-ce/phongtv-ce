name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
  pull_request:
    branches: [master]
  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
  # Run daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate quote
        run: npm run generate

      - name: Update README.md
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "phongtv.ce@gmail.com"
          git config user.name "phongtv-ce"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Updated README.md"
          git push
